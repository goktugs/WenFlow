services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wenflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wenflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /app
    command: sh -c "npm run prisma:deploy --workspace @wenflow/api && npm run dev --workspace @wenflow/api"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wenflow
      API_PORT: 4000
      JWT_SECRET: change-me
      COLLAB_URL: http://collab:4001
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  collab:
    build:
      context: .
      dockerfile: docker/collab/Dockerfile
    working_dir: /app
    command: npm run dev --workspace @wenflow/collab
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wenflow
      COLLAB_PORT: 4001
      JWT_SECRET: change-me
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    working_dir: /app
    command: npm run dev --workspace @wenflow/web -- --host 0.0.0.0
    environment:
      WEB_PORT: 5173
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_COLLAB_URL: ws://localhost:4001
    ports:
      - "5173:5173"
    depends_on:
      - api
      - collab

volumes:
  postgres_data:
