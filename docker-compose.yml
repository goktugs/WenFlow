services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wenflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /app
    command: npm run dev --workspace @wenflow/api
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  collab:
    build:
      context: .
      dockerfile: docker/collab/Dockerfile
    working_dir: /app
    command: npm run dev --workspace @wenflow/collab
    env_file:
      - .env
    ports:
      - "4001:4001"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    working_dir: /app
    command: npm run dev --workspace @wenflow/web -- --host 0.0.0.0
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api
      - collab

volumes:
  postgres_data:

